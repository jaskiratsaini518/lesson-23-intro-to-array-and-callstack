<html>

<head>
    <title>
        stacks
    </title>
</head>

<body>
    <p id="one"></p>
    <p id="two"></p>
    <p id="three"></p>
    <script>
        var numberone = ["Car", " Hop", " Jump", " Pop"];
        document.getElementById("one").innerHTML = numberone.pop();
        document.getElementById("two").innerHTML = numberone;
        document.getElementById("three").innerHTML = numberone.join("+");
    </script>
</body>

</html>
